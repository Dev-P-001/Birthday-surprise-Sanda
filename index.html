<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Birthday Treasure Hunt</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --pearl: #fbf8f6;
      --lav: #d9ceff;
      --pink: #ffd3e4;
      --blue: #cfe4ff;
      --ink: #2b2547;
      --soft: #6a6388;
      --gold: #b88a3e;
      --gold2: #e9d3a3;
      --glass: rgba(255, 255, 255, .58);
      --glass-b: rgba(255, 255, 255, .85);
      --shadow: rgba(120, 100, 190, .22);
      --aur: .55;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --pearl: #12102a;
        --lav: #5b45a8;
        --pink: #a44d86;
        --blue: #2f5fa8;
        --ink: #f6f1ff;
        --soft: #bfb6e0;
        --gold: #e8cf9a;
        --gold2: #c9a45c;
        --glass: rgba(255, 255, 255, .07);
        --glass-b: rgba(255, 255, 255, .18);
        --shadow: rgba(0, 0, 0, .5);
        --aur: .5;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --pearl: #12102a;
      --lav: #5b45a8;
      --pink: #a44d86;
      --blue: #2f5fa8;
      --ink: #f6f1ff;
      --soft: #bfb6e0;
      --gold: #e8cf9a;
      --gold2: #c9a45c;
      --glass: rgba(255, 255, 255, .07);
      --glass-b: rgba(255, 255, 255, .18);
      --shadow: rgba(0, 0, 0, .5);
      --aur: .5;
      color-scheme: dark
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--pearl);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif;
      font-weight: 400;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0
    }

    .aur {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: var(--aur)
    }

    .a1 {
      width: 70vmax;
      height: 42vmax;
      background: var(--lav);
      top: -14vmax;
      left: -20vmax;
      animation: aur1 26s ease-in-out infinite alternate
    }

    .a2 {
      width: 60vmax;
      height: 36vmax;
      background: var(--pink);
      top: 26vh;
      right: -26vmax;
      animation: aur2 32s ease-in-out infinite alternate
    }

    .a3 {
      width: 64vmax;
      height: 38vmax;
      background: var(--blue);
      bottom: -16vmax;
      left: -8vmax;
      animation: aur1 38s ease-in-out infinite alternate-reverse
    }

    .a4 {
      width: 30vmax;
      height: 20vmax;
      background: var(--gold2);
      top: 52vh;
      left: 20vw;
      opacity: .22;
      animation: aur2 44s ease-in-out infinite alternate
    }

    .sparkles i {
      position: absolute;
      bottom: -12px;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: var(--gold2);
      box-shadow: 0 0 8px 2px var(--gold2);
      opacity: 0;
      animation: rise-up var(--d) linear infinite
    }

    @keyframes rise-up {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      10% {
        opacity: .85
      }

      85% {
        opacity: .6
      }

      100% {
        transform: translateY(-110vh) translateX(26px);
        opacity: 0
      }
    }

    @keyframes aur1 {
      from {
        transform: translate(0, 0) rotate(0)
      }

      to {
        transform: translate(8vw, 6vh) rotate(18deg)
      }
    }

    @keyframes aur2 {
      from {
        transform: translate(0, 0) rotate(0)
      }

      to {
        transform: translate(-9vw, -5vh) rotate(-16deg)
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-12px)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.98)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes halo {

      0%,
      100% {
        box-shadow: 0 0 50px 10px rgba(233, 211, 163, .55), 0 0 120px 30px rgba(217, 206, 255, .45)
      }

      50% {
        box-shadow: 0 0 70px 16px rgba(233, 211, 163, .75), 0 0 150px 44px rgba(217, 206, 255, .55)
      }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 36px 22px 120px
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 32px;
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      box-shadow: 0 30px 70px -24px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .7)
    }

    .script {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500
    }

    h1,
    h2,
    h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      margin: 0;
      letter-spacing: .01em
    }

    .gold-t {
      background: linear-gradient(100deg, var(--gold), var(--gold2) 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .cover {
      text-align: center;
      margin-top: 11vh;
      padding: 72px 28px 60px;
      animation: rise 1.2s cubic-bezier(.2, .8, .2, 1) both
    }

    .moon {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 34px;
      background: radial-gradient(circle at 34% 30%, #fff, #f4ecdc 55%, var(--gold2));
      animation: halo 7s ease-in-out infinite, float 8s ease-in-out infinite;
      position: relative
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      right: 20px;
      top: 46px;
      background: rgba(184, 138, 62, .14);
      box-shadow: -30px -18px 0 -5px rgba(184, 138, 62, .12), -14px 22px 0 -8px rgba(184, 138, 62, .1)
    }

    .eyebrow {
      letter-spacing: .32em;
      text-transform: uppercase;
      font-size: .7rem;
      color: var(--soft);
      font-weight: 500;
      margin: 0
    }

    .cover h1 {
      font-size: clamp(2.8rem, 11vw, 4rem);
      line-height: 1.04;
      margin: .35em 0 .4em
    }

    .cover p.t {
      color: var(--soft);
      font-weight: 300;
      font-size: 1.05rem;
      margin: 0 auto 2.4em;
      max-width: 30ch
    }

    button {
      font: inherit;
      font-weight: 500;
      letter-spacing: .02em;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      color: #fff;
      padding: 14px 34px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .42), transparent 60%), linear-gradient(135deg, #8d79dd, #c870a8);
      box-shadow: 0 0 0 1px rgba(233, 211, 163, .55), 0 12px 34px -8px rgba(160, 110, 200, .65), 0 0 26px 2px rgba(233, 211, 163, .35);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 0 1px rgba(233, 211, 163, .8), 0 18px 40px -8px rgba(160, 110, 200, .75), 0 0 38px 6px rgba(233, 211, 163, .5)
    }

    button:active {
      transform: scale(.97)
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px
    }

    .hidden {
      display: none
    }

    .progress {
      text-align: center;
      color: var(--soft);
      letter-spacing: .3em;
      text-transform: uppercase;
      font-size: .68rem;
      margin: 6px 0 0;
      font-weight: 500
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 0
    }

    .dots b {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--glass-b);
      transition: all .6s
    }

    .dots b.on {
      background: var(--gold2);
      box-shadow: 0 0 10px 3px rgba(233, 211, 163, .8);
      transform: scale(1.25)
    }

    .clue {
      padding: 44px 26px 34px;
      margin: 30px 0;
      animation: rise .9s cubic-bezier(.2, .8, .2, 1) both
    }

    .clue .ct {
      font-size: 2.1rem;
      text-align: center;
      color: var(--gold)
    }

    .clue .q {
      font-size: 1.18rem;
      text-align: center;
      font-weight: 300;
      margin: .6em 0 1.8em
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center
    }

    input {
      flex: 1 1 200px;
      font: inherit;
      font-weight: 300;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid var(--glass-b);
      background: var(--glass);
      color: var(--ink);
      text-align: center;
      transition: box-shadow .3s, border-color .3s
    }

    input:focus {
      border-color: var(--gold2);
      box-shadow: 0 0 0 4px rgba(233, 211, 163, .28)
    }

    input::placeholder {
      color: var(--soft);
      opacity: .75
    }

    .msg {
      min-height: 1.8em;
      margin: 1.1em 0 0;
      text-align: center;
      color: var(--soft);
      font-weight: 300
    }

    .msg.bad {
      color: #c0507f
    }

    .link {
      display: block;
      margin: 4px auto 0;
      background: none !important;
      box-shadow: none !important;
      border: 0;
      color: var(--soft);
      padding: 8px 12px;
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-color: var(--gold2)
    }

    .tlh {
      text-align: center;
      font-size: 2.3rem;
      margin: 72px 0 14px;
      color: var(--gold)
    }

    .timeline {
      position: relative;
      margin: 10px 0 0;
      padding-left: 34px
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: linear-gradient(var(--gold2), var(--lav), transparent)
    }

    .mem {
      padding: 14px 14px 22px;
      margin: 0 0 34px;
      position: relative;
      animation: rise 1s cubic-bezier(.2, .8, .2, 1) both;
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .mem:hover {
      transform: translateY(-4px)
    }

    .mem::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 34px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gold2);
      box-shadow: 0 0 0 5px var(--glass), 0 0 16px 4px rgba(233, 211, 163, .8)
    }

    .photo {
      aspect-ratio: 4/3;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--lav), var(--pink), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.4rem;
      margin-bottom: 18px;
      overflow: hidden;
      opacity: .95
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .mem .date {
      color: var(--gold);
      font-size: 1.25rem;
      padding: 0 8px
    }

    .mem h3 {
      font-size: 1.75rem;
      margin: 0 0 .25em;
      padding: 0 8px
    }

    .mem p {
      margin: 0;
      padding: 0 8px;
      font-weight: 300
    }

    .final {
      text-align: center;
      padding: 60px 28px 52px;
      margin-top: 50px;
      animation: rise 1.3s cubic-bezier(.2, .8, .2, 1) both, halo 8s ease-in-out infinite 1.3s
    }

    .final .em {
      font-size: 3rem;
      display: inline-block;
      animation: float 6s ease-in-out infinite
    }

    .final h2 {
      font-size: clamp(2.6rem, 10vw, 3.4rem);
      margin: .15em 0 .35em;
      line-height: 1.05;
      background: linear-gradient(100deg, var(--gold), var(--gold2) 45%, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .final p {
      font-weight: 300;
      font-size: 1.08rem
    }

    .final .gift {
      margin-top: 28px;
      padding: 20px;
      border-radius: 24px;
      background: var(--glass-b);
      border: 1px solid var(--gold2);
      font-weight: 400
    }

    .final .sign {
      display: block;
      font-size: 2.1rem;
      color: var(--gold);
      margin-top: 26px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      .sparkles {
        display: none
      }
    }
  </style>
</head>

<body>
  <div class="sky" aria-hidden="true">
    <div class="aur a1"></div>
    <div class="aur a2"></div>
    <div class="aur a3"></div>
    <div class="aur a4"></div>
    <div class="sparkles" id="sparkles"></div>
  </div>
  <main>
    <section id="cover" class="cover glass">
      <div class="moon" aria-hidden="true"></div>
      <p class="eyebrow">A moonlit surprise</p>
      <h1 id="coverTitle" class="gold-t"></h1>
      <p class="t" id="coverText"></p>
      <button id="start">Begin</button>
    </section>

    <section id="game" class="hidden">
      <p class="progress" id="progress"></p>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="clue glass" id="clueBox">
        <div class="ct script" id="clueTitle"></div>
        <p class="q" id="clueQ"></p>
        <div class="row">
          <input id="ans" type="text" autocomplete="off" placeholder="Your answer" aria-label="Your answer">
          <button id="check">Unlock</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>
        <button class="link" id="hintBtn">Need a little hint?</button>
      </div>
      <h2 class="tlh script" id="tlTitle">Our memories</h2>
      <div class="timeline" id="timeline"></div>
      <div id="finalBox"></div>
    </section>
  </main>

  <script>
    /* ============================================================
       EDIT THIS SECTION ONLY — put your own details between the quotes
       ============================================================ */
    const CONFIG = {
      hisName: "My Love Sanda",            // his name or nickname
      yourName: "Devni",         // how you sign the final message
      coverText: "I hid 5 clues about us. Solve each one to unlock a memory, and a special surprise waits at the end.",

      clues: [
        {
          title: "Clue 1",
          question: "Where did we first meet?",                  // the riddle or question
          answers: ["home", "your Home", "gonagaldeniya", "devni's home"],                    // accepted answers, lowercase
          hint: "So, where did you go after you got to Sri Lanka.",
          memory: {
            date: "29 July 2026",                               // date of this memory
            title: "The day we met",                             // short title
            text: "We're both shy, neh? What was on your mind?",      // your words
            emoji: "💫",                                         // shown if no photo
            photo: "Image 1.jpg"                                            // optional: photo link (I can add real photos for you)
          }
        },
        {
          title: "Clue 2",
          question: "What was the first place we went together?",
          answers: ["Anuradhapura", "Anuradapura", "ruwanweliseya"],
          hint: "Remember my shawl...Fathima.",
          memory: { date: "03 August 2026", title: "Our first date", text: "The day I realized I had made the right decision", emoji: "🍽️", photo: "Image 2.jpg" }
        },
        {
          title: "Clue 3",
          question: "What is our inside joke? (one word)",
          answers: ["Patiya"],
          hint: "What the name nalan's used call his wife",
          memory: { date: "", title: "Laughing together", text: "Your words here.", emoji: "😂", photo: "" }
        },
        {
          title: "Clue 4",
          question: "Whats the date this all strated?",
          answers: ["30 october 2025", "30/10/2025", "30-10-2026", "2026/10/30", "2026-10-30"],
          hint: "You started our conversation first through the whatsapp",
          memory: { date: "Date", title: "Our best trip", text: "Your words here.", emoji: "✈️", photo: "" }
        },
        {
          title: "Clue 5",
          question: "What do I call you when no one is listening?",
          answers: ["baba", "raththaran", "Patiyo"],
          hint: "Only I say it.",
          memory: { date: "Date", title: "Our home", text: "Your words here.", emoji: "🏡", photo: "" }
        }
      ],

      final: {
        heading: "Happy Birthday!",
        message: "Write your heartfelt birthday message here. Tell him what he means to you and what you wish for him this year.",
        gift: "Your real surprise: e.g. “Dinner tonight at 7 — wear your best shirt!”"
      }
    };
    /* ============================================================ */

    const $ = id => document.getElementById(id);
    let step = 0;
    const norm = s => s.toLowerCase().replace(/[^a-z0-9\u0080-\uffff ]/g, "").replace(/\s+/g, " ").trim();
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    $("coverTitle").textContent = "Happy Birthday, " + CONFIG.hisName;
    $("coverText").textContent = CONFIG.coverText;
    document.title = "Happy Birthday, " + CONFIG.hisName;

    function showClue() {
      const c = CONFIG.clues[step];
      $("progress").textContent = "Clue " + (step + 1) + " of " + CONFIG.clues.length;
      $("dots").innerHTML = CONFIG.clues.map((_, i) => '<b class="' + (i <= step ? "on" : "") + '"></b>').join("");
      $("clueTitle").textContent = c.title;
      $("clueQ").textContent = c.question;
      $("ans").value = ""; $("msg").textContent = ""; $("msg").className = "msg";
      $("hintBtn").classList.remove("hidden");
      $("ans").focus();
    }
    function addMemory(m) {
      const el = document.createElement("div");
      el.className = "mem glass";
      const pic = m.photo ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.title) + '">' : esc(m.emoji || "💖");
      el.innerHTML = '<div class="photo">' + pic + '</div><div class="date script">' + esc(m.date) + '</div><h3>' + esc(m.title) + '</h3><p style="margin:0">' + esc(m.text) + '</p>';
      $("timeline").appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function check() {
      const c = CONFIG.clues[step];
      const v = norm($("ans").value);
      if (!v) return;
      if (c.answers.map(norm).includes(v)) {
        $("msg").textContent = "Beautiful. A memory is unlocked.";
        addMemory(c.memory);
        step++;
        if (step < CONFIG.clues.length) { setTimeout(showClue, 900); }
        else { finish(); }
      } else {
        $("msg").textContent = "Not quite. Try again, or ask for a hint.";
        $("msg").className = "msg bad";
      }
    }
    function finish() {
      $("clueBox").classList.add("hidden");
      $("progress").textContent = "All clues solved"; $("dots").innerHTML = CONFIG.clues.map(() => '<b class="on"></b>').join("");
      const f = CONFIG.final;
      $("finalBox").innerHTML = '<div class="final glass"><div class="em" aria-hidden="true">🎉</div><h2>' + esc(f.heading) + '</h2><p>' + esc(f.message) + '</p><div class="gift">' + esc(f.gift) + '</div><span class="sign script">With all my love, ' + esc(CONFIG.yourName) + '</span></div>';
      setTimeout(() => $("finalBox").scrollIntoView({ behavior: "smooth", block: "center" }), 1300);
    }
    /* particles + glow-follow */
    (function () {
      const s = $("sparkles"); for (let i = 0; i < 38; i++) { const e = document.createElement("i"); e.style.left = Math.random() * 100 + "%"; e.style.setProperty("--s", (2 + Math.random() * 4).toFixed(1) + "px"); e.style.setProperty("--d", (14 + Math.random() * 18).toFixed(0) + "s"); e.style.animationDelay = "-" + (Math.random() * 30).toFixed(0) + "s"; s.appendChild(e); }
      document.addEventListener("pointermove", e => { const b = e.target.closest && e.target.closest("button"); if (b) { const r = b.getBoundingClientRect(); b.style.setProperty("--mx", (e.clientX - r.left) + "px"); b.style.setProperty("--my", (e.clientY - r.top) + "px"); } });
    })();
    $("start").onclick = () => { $("cover").classList.add("hidden"); $("game").classList.remove("hidden"); showClue(); };
    $("check").onclick = check;
    $("ans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    $("hintBtn").onclick = () => { $("msg").textContent = "Hint: " + CONFIG.clues[step].hint; $("msg").className = "msg"; };
  </script>
</body>

</html>

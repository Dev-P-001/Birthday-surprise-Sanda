<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Birthday Treasure Hunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Caveat:wght@600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f6ecdc;
      --ink: #2a2147;
      --soft: #6a5f85;
      --card: #fffaf1;
      --rose: #c8456a;
      --line: #e3d3b8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1736;
        --ink: #f6ecdc;
        --soft: #b3a9d0;
        --card: #26204a;
        --rose: #f08aa5;
        --line: #3b3470;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b1736;
      --ink: #f6ecdc;
      --soft: #b3a9d0;
      --card: #26204a;
      --rose: #f08aa5;
      --line: #3b3470;
      color-scheme: dark
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Lora, Georgia, serif;
      line-height: 1.65
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 20px 80px
    }

    .hand {
      font-family: Caveat, cursive;
      font-weight: 600
    }

    h1 {
      font-size: 2.3rem;
      line-height: 1.15;
      margin: .2em 0
    }

    .cover {
      text-align: center;
      padding: 60px 0 30px
    }

    .cover .big {
      font-size: 4rem;
      display: block
    }

    .cover p {
      color: var(--soft)
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      background: var(--rose);
      color: #fff;
      padding: 12px 26px;
      font-weight: 600
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    .hidden {
      display: none
    }

    .clue {
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: 18px;
      padding: 22px;
      margin: 24px 0
    }

    .clue .q {
      font-size: 1.15rem;
      margin: .3em 0 1em
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    input {
      flex: 1 1 180px;
      font: inherit;
      padding: 11px 14px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--bg);
      color: var(--ink)
    }

    .msg {
      min-height: 1.6em;
      margin: .7em 0 0;
      color: var(--soft)
    }

    .msg.bad {
      color: var(--rose)
    }

    .link {
      background: none;
      color: var(--soft);
      padding: 6px 0;
      font-weight: 400;
      text-decoration: underline
    }

    .progress {
      color: var(--soft);
      font-size: .95rem
    }

    .timeline {
      position: relative;
      margin: 36px 0 0;
      padding-left: 26px;
      border-left: 3px solid var(--rose)
    }

    .mem {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin: 0 0 22px;
      position: relative;
      animation: pop .6s ease
    }

    .mem::before {
      content: "";
      position: absolute;
      left: -36px;
      top: 22px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--rose);
      border: 3px solid var(--bg)
    }

    .mem .date {
      color: var(--rose);
      font-size: 1.35rem
    }

    .mem h3 {
      margin: .1em 0 .4em
    }

    .photo {
      aspect-ratio: 4/3;
      border-radius: 12px;
      background: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 12px;
      overflow: hidden
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .final {
      background: var(--rose);
      color: #fff;
      border-radius: 22px;
      padding: 30px 24px;
      text-align: center;
      margin-top: 30px;
      animation: pop .8s ease
    }

    .final h2 {
      font-size: 2rem;
      margin: .1em 0
    }

    .final .gift {
      background: rgba(255, 255, 255, .18);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      font-size: 1.1rem
    }

    .final .sign {
      font-size: 1.8rem;
      margin-top: 14px;
      display: block
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .mem,
      .final {
        animation: none
      }
    }
  </style>
</head>

<body>
  <main>
    <section id="cover" class="cover">
      <span class="big" aria-hidden="true">🎁</span>
      <h1 id="coverTitle"></h1>
      <p id="coverText"></p>
      <button id="start">Start the hunt</button>
    </section>

    <section id="game" class="hidden">
      <p class="progress" id="progress"></p>
      <div class="clue" id="clueBox">
        <div class="hand" id="clueTitle" style="font-size:1.6rem;color:var(--rose)"></div>
        <p class="q" id="clueQ"></p>
        <div class="row">
          <input id="ans" type="text" autocomplete="off" placeholder="Type your answer" aria-label="Your answer">
          <button id="check">Check</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>
        <button class="link" id="hintBtn">Need a hint?</button>
      </div>
      <h2 class="hand" id="tlTitle" style="font-size:1.9rem;margin:30px 0 0">Our memories</h2>
      <div class="timeline" id="timeline"></div>
      <div id="finalBox"></div>
    </section>
  </main>

  <script>
    /* ============================================================
       EDIT THIS SECTION ONLY — put your own details between the quotes
       ============================================================ */
    const CONFIG = {
      hisName: "Sanda",            // his name or nickname
      yourName: "Devni",         // how you sign the final message
      coverText: "I hid 5 clues about us. Solve each one to unlock a memory, and a special surprise waits at the end.",

      clues: [
        {
          title: "Clue 1",
          question: "Where did we first meet?",                  // the riddle or question
          answers: ["In House", "Gonagaldeniya"],                    // accepted answers, lowercase
          hint: "So, where did you go after you got to Sri Lanka.",
          memory: {
            date: " 28 August 2026",                               // date of this memory
            title: "The day we met",                             // short title
            text: "We're both shy, neh? What was on your mind?",      // your words
            emoji: "💫",                                         // shown if no photo
            photo: "Image 1.jpeg"                                            // optional: photo link (I can add real photos for you)
          }
        },
        {
          title: "Clue 2",
          question: "What was the first movie or place we went together?",
          answers: ["answer one", "answer two"],
          hint: "A small hint only he will understand.",
          memory: { date: "Date", title: "Our first date", text: "Your words here.", emoji: "🍽️", photo: "" }
        },
        {
          title: "Clue 3",
          question: "What is our inside joke? (one word)",
          answers: ["joke"],
          hint: "It always makes us laugh.",
          memory: { date: "Date", title: "Laughing together", text: "Your words here.", emoji: "😂", photo: "" }
        },
        {
          title: "Clue 4",
          question: "Where was our favourite trip?",
          answers: ["place"],
          hint: "We took too many photos there.",
          memory: { date: "Date", title: "Our best trip", text: "Your words here.", emoji: "✈️", photo: "" }
        },
        {
          title: "Clue 5",
          question: "What do I call you when no one is listening?",
          answers: ["nickname"],
          hint: "Only I say it.",
          memory: { date: "Date", title: "Our home", text: "Your words here.", emoji: "🏡", photo: "" }
        }
      ],

      final: {
        heading: "Happy Birthday!",
        message: "Write your heartfelt birthday message here. Tell him what he means to you and what you wish for him this year.",
        gift: "Your real surprise: e.g. “Dinner tonight at 7 — wear your best shirt!”"
      }
    };
    /* ============================================================ */

    const $ = id => document.getElementById(id);
    let step = 0;
    const norm = s => s.toLowerCase().replace(/[^a-z0-9\u0080-\uffff ]/g, "").replace(/\s+/g, " ").trim();
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    $("coverTitle").textContent = "Happy Birthday, " + CONFIG.hisName;
    $("coverText").textContent = CONFIG.coverText;
    document.title = "Happy Birthday, " + CONFIG.hisName;

    function showClue() {
      const c = CONFIG.clues[step];
      $("progress").textContent = "Clue " + (step + 1) + " of " + CONFIG.clues.length;
      $("clueTitle").textContent = c.title;
      $("clueQ").textContent = c.question;
      $("ans").value = ""; $("msg").textContent = ""; $("msg").className = "msg";
      $("hintBtn").classList.remove("hidden");
      $("ans").focus();
    }
    function addMemory(m) {
      const el = document.createElement("div");
      el.className = "mem";
      const pic = m.photo ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.title) + '">' : esc(m.emoji || "💖");
      el.innerHTML = '<div class="photo">' + pic + '</div><div class="date hand">' + esc(m.date) + '</div><h3>' + esc(m.title) + '</h3><p style="margin:0">' + esc(m.text) + '</p>';
      $("timeline").appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    function check() {
      const c = CONFIG.clues[step];
      const v = norm($("ans").value);
      if (!v) return;
      if (c.answers.map(norm).includes(v)) {
        $("msg").textContent = "Yes! Memory unlocked.";
        addMemory(c.memory);
        step++;
        if (step < CONFIG.clues.length) { setTimeout(showClue, 900); }
        else { finish(); }
      } else {
        $("msg").textContent = "Not quite. Try again, or tap the hint.";
        $("msg").className = "msg bad";
      }
    }
    function finish() {
      $("clueBox").classList.add("hidden");
      $("progress").textContent = "All clues solved!";
      const f = CONFIG.final;
      $("finalBox").innerHTML = '<div class="final"><div style="font-size:3rem" aria-hidden="true">🎉</div><h2>' + esc(f.heading) + '</h2><p>' + esc(f.message) + '</p><div class="gift">' + esc(f.gift) + '</div><span class="sign hand">With all my love, ' + esc(CONFIG.yourName) + '</span></div>';
      setTimeout(() => $("finalBox").scrollIntoView({ behavior: "smooth", block: "center" }), 1300);
    }
    $("start").onclick = () => { $("cover").classList.add("hidden"); $("game").classList.remove("hidden"); showClue(); };
    $("check").onclick = check;
    $("ans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    $("hintBtn").onclick = () => { $("msg").textContent = "Hint: " + CONFIG.clues[step].hint; $("msg").className = "msg"; };
  </script>
</body>

</html>
